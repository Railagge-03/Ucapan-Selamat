
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selamat Ulang Tahun, Sayang!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎉 Selamat Ulang Tahun, Cintaku! 🎉</h1>
  <p>Semoga hari ini dipenuhi dengan cinta dan tawa 💖</p>

  <div class="question" id="question1">
    <h2>1. Apakah kamu ingin menjadi pacarku sayang? 😳</h2>
    <button id="yes-btn">Iya ❤️</button>
    <button id="no-btn">Tidak 🙁</button>
  </div>

  <div class="question" id="question2" style="display: none;">
    <h2>2. Seberapa cintanya kamu denganku? 💌</h2>
    <textarea placeholder="Tulis di sini ya..."></textarea>
    <button id="next-to-q3">Lanjut ➡️</button>
  </div>

  <div class="question" id="question3" style="display: none;">
    <h2>3. Berikan beberapa larangan dan juga harapanmu kepadaku sayang! 🌸</h2>
    <textarea placeholder="Aku ingin kamu... dan jangan kamu... 😊"></textarea>
  </div>

  <div id="secret-message" style="display: none;">
    <button id="reveal-message">Lihat Pesan Rahasia 💖</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
